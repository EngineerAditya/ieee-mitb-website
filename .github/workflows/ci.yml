name: CI

on:
  push:
    branches: [main]
  pull_request:

# Placeholder env so env validation + `next build` succeed without secrets.
# Public pages render dynamically (no DB access at build time), so these never
# connect anywhere. Real values belong in deployment env / GitHub secrets.
env:
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/postgres
  DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/postgres
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
